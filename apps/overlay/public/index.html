<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dezzer — Now Playing</title>
    <link rel="stylesheet" href="./assets/overlay.css" />
  </head>
  <body data-theme="glass" data-state="loading">
    <main class="widget" id="widget" aria-live="polite">
      <div class="artwork" id="artwork">
        <img id="artwork-image" alt="" decoding="async" />
        <div class="artwork-placeholder" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="presentation">
            <circle cx="24" cy="24" r="15" fill="none" stroke="currentColor" stroke-width="3" />
            <circle cx="24" cy="24" r="3" fill="currentColor" />
          </svg>
        </div>
      </div>

      <div class="details">
        <div class="line title" id="title"><span class="scroller" id="title-text"></span></div>
        <div class="line artist" id="artist"><span class="scroller" id="artist-text"></span></div>
        <div class="line album" id="album"><span class="scroller" id="album-text"></span></div>

        <div class="progress" id="progress" data-waveform="false">
          <div class="progress-track">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <canvas class="waveform" id="waveform" aria-hidden="true"></canvas>
          <div class="times" id="times">
            <span id="elapsed">--:--</span>
            <span id="duration">--:--</span>
          </div>
        </div>
      </div>

      <div class="status-badge" id="status-badge" aria-hidden="true"></div>
    </main>

    <script type="module" src="./assets/overlay.js"></script>
  </body>
</html>
