<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Deezer</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #2d2d2d;
        --panel: #3d3d3d;
        --line: #4a4a4a;
        --text: #e9e9e9;
        --dim: #9a9a9a;
        --ok: #4cd964;
        --warn: #ffb020;
        --err: #ff5c5c;
        --accent: #a238ff;
      }
      body {
        margin: 0;
        padding: 12px;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
      }
      h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--dim);
        margin: 18px 0 8px;
      }
      h2:first-child {
        margin-top: 0;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px 12px;
      }
      .row {
        display: grid;
        grid-template-columns: 118px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .row:last-child {
        margin-bottom: 0;
      }
      label {
        color: var(--dim);
      }
      select,
      input[type="number"],
      input[type="text"] {
        width: 100%;
        background: #262626;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 5px 7px;
        font: inherit;
      }
      input[type="checkbox"] {
        accent-color: var(--accent);
      }
      button {
        background: #4a4a4a;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #565656;
      }
      button.primary {
        background: var(--accent);
        border-color: transparent;
      }
      .buttons {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--dim);
        flex: none;
      }
      .dot[data-tone="ok"] {
        background: var(--ok);
      }
      .dot[data-tone="warn"] {
        background: var(--warn);
      }
      .dot[data-tone="err"] {
        background: var(--err);
      }
      .caps {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }
      .cap {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 1px 9px;
        font-size: 11px;
        color: var(--dim);
      }
      .cap[data-on="true"] {
        color: var(--text);
        border-color: var(--accent);
      }
      .hint {
        color: var(--dim);
        font-size: 12px;
        margin-top: 8px;
      }
      .url {
        font-family: Consolas, "Cascadia Mono", monospace;
        font-size: 11px;
        word-break: break-all;
        background: #262626;
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 7px;
        min-height: 34px;
      }
      textarea {
        width: 100%;
        height: 120px;
        background: #262626;
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 4px;
        font-family: Consolas, monospace;
        font-size: 11px;
        padding: 7px;
        resize: vertical;
      }
      details {
        margin-top: 10px;
      }
      summary {
        cursor: pointer;
        color: var(--dim);
      }
    </style>
  </head>
  <body>
    <h2 data-i18n="pi.status">État</h2>
    <div class="panel">
      <div class="row">
        <label data-i18n="pi.localService">Service local</label>
        <div class="status"><span class="dot" id="bridge-dot"></span><span id="bridge-text">…</span></div>
      </div>
      <div class="row">
        <label data-i18n="pi.deezer">Deezer</label>
        <div class="status"><span class="dot" id="player-dot"></span><span id="player-text">…</span></div>
      </div>
      <div class="row">
        <label data-i18n="pi.session">Session</label>
        <span id="session-text">—</span>
      </div>
      <div class="row">
        <label data-i18n="pi.capabilities">Capacités</label>
        <div class="caps" id="caps"></div>
      </div>
      <div class="hint" id="diagnostic"></div>
      <div class="buttons">
        <button id="test" data-i18n="pi.testConnection">Tester la connexion</button>
        <button id="restart" data-i18n="pi.restartService">Redémarrer le service</button>
      </div>
    </div>

    <h2 data-i18n="pi.keys">Touches</h2>
    <div class="panel">
      <div class="row">
        <label data-i18n="pi.nowPlayingText">Texte « en cours »</label>
        <select id="now-playing-format">
          <option value="title-artist" data-i18n="pi.formatTitleArtist">Titre + artiste</option>
          <option value="title" data-i18n="pi.formatTitle">Titre seul</option>
          <option value="artist" data-i18n="pi.formatArtist">Artiste seul</option>
        </select>
      </div>
      <div class="row">
        <label data-i18n="pi.artworkOnKeys">Pochette en fond</label>
        <input type="checkbox" id="showArtworkOnKeys" />
      </div>
      <div class="row">
        <label data-i18n="pi.volumeStep">Pas de volume</label>
        <select id="volumeStep">
          <option value="1">1 %</option>
          <option value="2">2 %</option>
          <option value="5">5 %</option>
          <option value="10">10 %</option>
        </select>
      </div>
      <div class="hint" data-i18n="pi.volumeHint">
        Les actions Volume agissent sur le curseur de Deezer dans le <strong>mixeur
        Windows</strong>. Il se combine avec le volume interne de Deezer : à 50 % des deux,
        le son résultant vaut 25 %. Le curseur affiché dans Deezer ne bouge pas.
      </div>
    </div>

    <h2 data-i18n="pi.session">Session</h2>
    <div class="panel">
      <div class="buttons">
        <button id="rotate" data-i18n="pi.rotateToken">Régénérer le jeton</button>
      </div>
    </div>

    <details>
      <summary data-i18n="pi.diagnosticExport">Diagnostic exportable</summary>
      <textarea id="diagnostic-export" readonly></textarea>
      <div class="buttons"><button id="copy-diagnostic" data-i18n="pi.copyDiagnostic">Copier le diagnostic</button></div>
    </details>

    <script>
      let websocket = null;
      let uuid = null;
      let actionInfo = null;
      let latest = null;

      const $ = (id) => document.getElementById(id);

      function connectElgatoStreamDeckSocket(inPort, inUUID, inRegisterEvent, inInfo, inActionInfo) {
        uuid = inUUID;
        actionInfo = inActionInfo ? JSON.parse(inActionInfo) : null;
        websocket = new WebSocket("ws://127.0.0.1:" + inPort);

        websocket.onopen = () => {
          websocket.send(JSON.stringify({ event: inRegisterEvent, uuid: inUUID }));
          websocket.send(JSON.stringify({ event: "getGlobalSettings", context: inUUID }));
          send({ action: "getTranslations" });
          send({ action: "getState" });
        };

        websocket.onmessage = (message) => {
          const data = JSON.parse(message.data);
          if (data.event === "sendToPropertyInspector") {
            if (data.payload && data.payload.event === "dezzer.i18n") {
              applyTranslations(data.payload.translations);
            } else {
              applyState(data.payload);
            }
          }
          if (data.event === "didReceiveGlobalSettings") applyGlobalSettings(data.payload.settings);
        };
      }
      window.connectElgatoStreamDeckSocket = connectElgatoStreamDeckSocket;

      function send(payload) {
        if (!websocket || websocket.readyState !== 1) return;
        websocket.send(
          JSON.stringify({
            event: "sendToPlugin",
            action: actionInfo ? actionInfo.action : "com.dezzer.deezer.diagnostics",
            context: uuid,
            payload,
          }),
        );
      }

      function setGlobal(patch) {
        if (!websocket || websocket.readyState !== 1) return;
        websocket.send(
          JSON.stringify({
            event: "setGlobalSettings",
            context: uuid,
            payload: Object.assign({}, latestGlobal, patch),
          }),
        );
      }

      let latestGlobal = {};
      function applyGlobalSettings(settings) {
        latestGlobal = settings || {};
        $("now-playing-format").value = latestGlobal.nowPlayingFormat || "title-artist";
        $("showArtworkOnKeys").checked = latestGlobal.showArtworkOnKeys !== false;
        $("volumeStep").value = String(latestGlobal.volumeStep || 5);
      }

      const BRIDGE_LABELS = {
        ready: ["ok", "pi.bridgeReady", "Actif"],
        starting: ["warn", "pi.bridgeStarting", "Démarrage…"],
        stopped: ["warn", "pi.bridgeStopped", "Arrêté"],
        failed: ["err", "pi.bridgeFailed", "En échec"],
      };

      // Les libellés viennent du plugin, seul à connaître la langue choisie dans Stream Deck.
      let strings = {};
      const T = (key, fallback) => strings[key] || fallback;

      function applyTranslations(translations) {
        strings = translations || {};

        for (const element of document.querySelectorAll("[data-i18n]")) {
          const value = strings[element.dataset.i18n];
          if (value) element.textContent = value;
        }
        for (const element of document.querySelectorAll("[data-i18n-placeholder]")) {
          const value = strings[element.dataset.i18nPlaceholder];
          if (value) element.placeholder = value;
        }

        if (latest) applyState(latest);
        renderUrl();
      }

      function applyState(payload) {
        if (!payload || payload.event !== "dezzer.state") return;
        latest = payload;

        const [bridgeTone, bridgeKey, bridgeFallback] = BRIDGE_LABELS[payload.bridge.status] || [
          "",
          "",
          "—",
        ];
        const bridgeLabel = T(bridgeKey, bridgeFallback);
        $("bridge-dot").dataset.tone = bridgeTone;
        $("bridge-text").textContent = payload.bridge.version
          ? bridgeLabel + " — v" + payload.bridge.version
          : bridgeLabel;

        const available = payload.player.available;
        $("player-dot").dataset.tone = available
          ? payload.player.status === "playing"
            ? "ok"
            : "warn"
          : "";
        $("player-text").textContent = available
          ? payload.player.status === "playing"
            ? T("pi.playerPlaying", "En lecture")
            : T("pi.playerPaused", "En pause")
          : T("pi.playerMissing", "Non détecté");

        $("session-text").textContent = payload.player.sourceLabel || "—";
        $("diagnostic").textContent = payload.diagnostic || "";

        const caps = payload.player.capabilities || {};
        const names = {
          playPause: ["pi.capPlayPause", "Play/Pause"],
          next: ["pi.capNext", "Suivant"],
          previous: ["pi.capPrevious", "Précédent"],
          stop: ["pi.capStop", "Stop"],
          seek: ["pi.capSeek", "Seek"],
          volume: ["pi.capVolume", "Volume"],
        };
        $("caps").innerHTML = "";
        for (const key of Object.keys(names)) {
          const chip = document.createElement("span");
          chip.className = "cap";
          chip.dataset.on = String(Boolean(caps[key]));
          chip.textContent = T(names[key][0], names[key][1]);
          $("caps").appendChild(chip);
        }

        $("diagnostic-export").value = JSON.stringify(
          {
            plugin: payload.environment,
            bridge: payload.bridge,
            player: payload.player,
          },
          null,
          2,
        );
      }

      $("now-playing-format").addEventListener("change", () =>
        setGlobal({ nowPlayingFormat: $("now-playing-format").value }),
      );
      $("showArtworkOnKeys").addEventListener("change", () =>
        setGlobal({ showArtworkOnKeys: $("showArtworkOnKeys").checked }),
      );
      $("volumeStep").addEventListener("change", () =>
        setGlobal({ volumeStep: Number($("volumeStep").value) }),
      );
      $("test").addEventListener("click", () => send({ action: "getState" }));
      $("restart").addEventListener("click", () => send({ action: "restartBridge" }));
      $("rotate").addEventListener("click", () => {
        if (confirm(T("pi.rotateConfirm", "Régénérer le jeton ? Le service local redémarre."))) {
          send({ action: "rotateToken" });
        }
      });
      $("copy-diagnostic").addEventListener("click", () =>
        navigator.clipboard.writeText($("diagnostic-export").value),
      );
    </script>
  </body>
</html>
