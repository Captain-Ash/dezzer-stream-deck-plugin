name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - run: npm test

      - run: npm run build

      - run: npm run pack

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/com.dezzer.deezer.streamDeckPlugin
          generate_release_notes: true
