name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/bridge

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # Le paquet est valide ici plutot qu'a la publication : une release ne doit jamais
      # echouer sur une erreur que la CI pouvait voir.
      - run: npx --no-install streamdeck validate apps/streamdeck-plugin/com.dezzer.deezer.sdPlugin
